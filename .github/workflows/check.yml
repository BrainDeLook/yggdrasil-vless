name: Validate installer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax and help
        run: |
          bash -n install.sh install-ygg-vless.sh
          bash install.sh --help
          bash install-ygg-vless.sh --help
          sha256sum -c SHA256SUMS
      - name: Download verified sing-box used by the installer
        run: |
          mkdir -p .test-bin
          curl -fL --retry 3 --proto '=https' --proto-redir '=https' \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-linux-amd64.tar.gz \
            -o .test-bin/sing-box.tar.gz
          echo 'e2bdf179c15a3652955dc44867e33ca0965c9c9b91b34267dcc5a5d639a5feee  .test-bin/sing-box.tar.gz' | sha256sum -c -
          tar -xzf .test-bin/sing-box.tar.gz -C .test-bin
      - name: Verify config, identity preservation, IPv6 VLESS and UUID authentication
        env:
          SING_BOX_BINARY: .test-bin/sing-box-1.14.3-linux-amd64/sing-box
        run: python3 tests/verify.py
